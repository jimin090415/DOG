<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>랜덤 강아지 생성기</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.0/color-thief.umd.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #f5f7fb;
      font-family: "Segoe UI", Apple SD Gothic Neo, sans-serif;
      padding: 40px 20px;
      transition: background 0.8s ease; 
    }

    .card {
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      transition: background 0.8s ease, box-shadow 0.8s ease;
      margin-bottom: 30px;
    }

    h1 {
      margin-bottom: 10px;
      color: #333;
    }

    .counter-container {
      display: flex;
      justify-content: space-around;
      margin-bottom: 15px;
      font-size: 15px;
      font-weight: bold;
    }

    .counter { color: #666; }
    .like-counter { color: #ff4f79; }

    .image-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 16px;
      background: #eee;
      margin-bottom: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
    }

    #dogImage {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    /* MBTI 표시 영역 스타일 */
    .mbti-container {
      margin-bottom: 20px;
      min-height: 60px;
      display: none;
    }

    .mbti-badge {
      display: inline-block;
      background: #4f7cff;
      color: white;
      padding: 4px 12px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 6px;
      transition: background 0.5s ease;
    }

    .mbti-desc {
      font-size: 15px;
      color: #555;
      font-weight: 500;
    }

    #loading {
      margin-bottom: 15px;
      color: #666;
      font-size: 14px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .main-btn-group, .sub-btn-group {
      display: flex;
      gap: 10px;
    }

    button {
      border: none;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    #newDogBtn { background: #4f7cff; color: white; flex: 2; }
    #autoBtn { background: #fff3e0; color: #ff9800; font-weight: bold; flex: 1; }
    #autoBtn.playing { background: #ff9800; color: white; }
    #likeBtn { background: #ffebee; color: #ff4f79; font-weight: bold; flex: 1; }
    #downloadBtn { background: #e8f5e9; color: #4caf50; font-weight: bold; flex: 1; }

    #likeBtn:hover:not(:disabled),
    #downloadBtn:hover:not(:disabled),
    #newDogBtn:hover:not(:disabled),
    #autoBtn:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    #autoBtn:hover:not(:disabled):not(.playing) { background: #ff9800; color: white; }
    #likeBtn:hover:not(:disabled) { background: #ff4f79; color: white; }
    #downloadBtn:hover:not(:disabled) { background: #4caf50; color: white; }

    button:active:not(:disabled) { transform: translateY(0); }
    button:disabled { background: #eee; color: #bbb; cursor: not-allowed; transform: none !important; }

    /* 좋아요 보관함 스타일 */
    .gallery-container {
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    .gallery-container h2 { font-size: 18px; color: #333; margin-bottom: 15px; text-align: left; }
    
    /* 💡 보관함 내부 고정 높이 + 스크롤 적용 */
    .gallery-grid { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: 12px; 
      max-height: 260px;       /* 최대 높이 제한 (약 2줄 반 분량) */
      overflow-y: auto;        /* 사진이 많아지면 내부 세로 스크롤 생성 */
      padding-right: 4px;
    }
    
    /* 💡 스크롤바 슬림 & 모던 디자인 커스텀 */
    .gallery-grid::-webkit-scrollbar {
      width: 6px;
    }
    .gallery-grid::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 10px;
    }
    .gallery-grid::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 10px;
    }
    .gallery-grid::-webkit-scrollbar-thumb:hover {
      background: #aaa;
    }

    .gallery-item { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: transform 0.2s; cursor: pointer; }
    .gallery-item:hover { transform: scale(1.05); }
    .empty-message { grid-column: span 3; color: #aaa; font-size: 14px; padding: 20px 0; text-align: center; }

    @media (max-width: 600px) { h1 { font-size: 24px; } }
  </style>
</head>
<body>

  <div class="card">
    <h1>🐶 랜덤 강아지 생성기</h1>
    
    <div class="counter-container">
      <p class="counter">만난 강아지: <span id="countNumber">0</span>마리</p>
      <p class="like-counter">❤️ 좋아요: <span id="likeNumber">0</span>마리</p>
    </div>

    <div class="image-box">
      <img id="dogImage" alt="강아지 사진" crossOrigin="anonymous">
    </div>

    <div class="mbti-container" id="mbtiContainer">
      <div class="mbti-badge" id="mbtiBadge">ENFP</div>
      <div class="mbti-desc" id="mbtiDesc">폭풍 꼬리치기 장인, 사교성 만렙형!</div>
    </div>

    <p id="loading">강아지 사진을 불러오는 중...</p>

    <div class="btn-group">
      <div class="main-btn-group">
        <button id="newDogBtn">새로운 강아지 보기</button>
        <button id="autoBtn">▶️ 자동 재생</button>
      </div>
      <div class="sub-btn-group">
        <button id="likeBtn" disabled>❤️ 좋아요</button>
        <button id="downloadBtn" disabled>💾 사진 저장</button>
      </div>
    </div>
  </div>

  <div class="gallery-container">
    <h2>❤️ 내가 좋아하는 강아지 보관함</h2>
    <div class="gallery-grid" id="galleryGrid">
      <p class="empty-message" id="emptyMessage">아직 좋아요 한 강아지가 없습니다.</p>
    </div>
  </div>

  <script>
    // 강아지 MBTI 데이터 리스트
    const dogMbtiList = [
      { type: "ENFP", desc: "🐾 흥분하면 프로펠러 꼬리 가동! 사교성 만렙형" },
      { type: "ENFJ", desc: "🐾 동네 강아지 다 챙기는 골목대장, 대장님형" },
      { type: "ENTP", desc: "🐾 문 열기, 간식 훔쳐먹기 천재! 장난꾸러기 브레인형" },
      { type: "ENTJ", desc: "🐾 산책 경로는 내가 정한다! 똑 부러진 카리스마형" },
      { type: "ESFP", desc: "🐾 낯선 사람도 내 친구! 애교 만점 파티 피플형" },
      { type: "ESFJ", desc: "🐾 주인이 집에 오면 눈물 흘리는 다정다감형" },
      { type: "ESTP", desc: "🐾 일단 달리고 생각한다! 스피드 광 무한체력형" },
      { type: "ESTJ", desc: "🐾 밥 시간 1분만 늦어도 짖는 규칙 엄격 댕댕이형" },
      { type: "INFP", desc: "🐾 주인 우울할 때 옆에 가만히 턱 괴어주는 위로 요정형" },
      { type: "INFJ", desc: "🐾 가만히 앉아 먼 산을 바라보는 사색가형" },
      { type: "INTP", desc: "🐾 노즈워크 장난감을 최단 시간에 풀어내는 천재 천재형" },
      { type: "INTJ", desc: "🐾 주인 머리 꼭대기 위에서 간식을 유도하는 전략가형" },
      { type: "ISFP", desc: "🐾 이 세상에서 소파와 내가 한 몸이 되는 평화로운 집돌이형" },
      { type: "ISFJ", desc: "🐾 주인이 화장실 갈 때도 문 앞에서 지켜주는 보디가드형" },
      { type: "ISTP", desc: "🐾 혼자 장난감 가지고 잘 노는 시크한 마이웨이형" },
      { type: "ISTJ", desc: "🐾 산책할 때 지정된 경로로만 가야 직성이 풀리는 선비형" }
    ];

    const dogImage = document.getElementById("dogImage");
    const loading = document.getElementById("loading");
    const newDogBtn = document.getElementById("newDogBtn");
    const autoBtn = document.getElementById("autoBtn");
    const likeBtn = document.getElementById("likeBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const countNumber = document.getElementById("countNumber");
    const likeNumber = document.getElementById("likeNumber");
    
    const galleryGrid = document.getElementById("galleryGrid");
    const emptyMessage = document.getElementById("emptyMessage");

    const colorThief = new ColorThief();

    let dogCount = 0;
    let likeCount = 0;
    let currentImageUrl = "";
    let likedDogs = [];

    let isAutoPlaying = false; 
    let autoTimer = null;
    const SLIDE_INTERVAL = 4000; 

    async function getDogImage() {
      if (!isAutoPlaying) {
        newDogBtn.disabled = true;
        likeBtn.disabled = true;
        downloadBtn.disabled = true;
      }
      
      mbtiContainer.style.display = "none";
      dogImage.style.display = "none";
      loading.textContent = "강아지 사진을 불러오는 중...";

      try {
        const response = await fetch("https://dog.ceo/api/breeds/image/random?t=" + Date.now());
        const data = await response.json();

        currentImageUrl = data.message;
        dogImage.src = currentImageUrl;

        dogImage.onload = () => {
          loading.textContent = isAutoPlaying ? "자동 슬라이드쇼 재생 중... 🐾" : "사진 불러오기 완료!";
          dogImage.style.display = "block";
          
          if (isAutoPlaying) {
            likeBtn.disabled = false;
            downloadBtn.disabled = false;
          } else {
            newDogBtn.disabled = false;
            likeBtn.disabled = false; 
            downloadBtn.disabled = false;
          }

          dogCount++;
          countNumber.textContent = dogCount;

          // 랜덤 MBTI 할당
          const randomIndex = Math.floor(Math.random() * dogMbtiList.length);
          const randomMbti = dogMbtiList[randomIndex];
          
          mbtiBadge.textContent = randomMbti.type;
          mbtiDesc.textContent = randomMbti.desc;
          mbtiContainer.style.display = "block";

          // 색상 추출 및 배경색 적용
          try {
            const color = colorThief.getColor(dogImage);
            document.body.style.background = `rgba(${color[0]}, ${color[1]}, ${color[2]}, 0.15)`;
            document.querySelector('.card').style.boxShadow = `0 15px 35px rgba(${color[0]}, ${color[1]}, ${color[2]}, 0.15)`;
            mbtiBadge.style.background = `rgb(${color[0]}, ${color[1]}, ${color[2]})`;
          } catch (colorError) {
            console.log("색상 추출 실패", colorError);
            mbtiBadge.style.background = "#4f7cff";
          }
        };

      } catch (error) {
        loading.textContent = "사진을 불러오지 못했습니다.";
        console.error(error);
        if (!isAutoPlaying) newDogBtn.disabled = false;
      }
    }

    // 좋아요 기능
    likeBtn.addEventListener("click", () => {
      if (likedDogs.includes(currentImageUrl)) return;

      likeCount++;
      likeNumber.textContent = likeCount;
      likeBtn.disabled = true;
      loading.textContent = "이 강아지를 좋아합니다! 🥰";

      likedDogs.push(currentImageUrl);

      if (emptyMessage) emptyMessage.style.display = "none";

      const newImg = document.createElement("img");
      newImg.src = currentImageUrl;
      newImg.classList.add("gallery-item");
      newImg.alt = "좋아요 한 강아지";
      
      // 보관함 사진 클릭 시 메인 창으로 불러오기
      newImg.addEventListener("click", () => {
        dogImage.src = newImg.src;
        currentImageUrl = newImg.src;
        loading.textContent = "보관함에서 불러온 사진입니다. 📸";
        likeBtn.disabled = true;
        mbtiContainer.style.display = "none"; 
      });

      galleryGrid.appendChild(newImg);
    });

    // 기기 파일 다운로드 기능
    downloadBtn.addEventListener("click", async () => {
      if (!currentImageUrl) return;
      const originalText = loading.textContent;
      loading.textContent = "사진을 기기에 저장하는 중...";
      downloadBtn.disabled = true;

      try {
        const response = await fetch(currentImageUrl);
        const blob = await response.blob();
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `cute-dog-${Date.now()}.jpg`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        loading.textContent = "사진 저장 완료! 💾";
      } catch (error) {
        loading.textContent = "사진 저장에 실패했습니다.";
      } finally {
        downloadBtn.disabled = false;
        setTimeout(() => { loading.textContent = originalText; }, 2000);
      }
    });

    // 자동 재생 기능
    autoBtn.addEventListener("click", () => {
      if (!isAutoPlaying) {
        isAutoPlaying = true;
        autoBtn.textContent = "⏸️ 정지";
        autoBtn.classList.add("playing");
        newDogBtn.disabled = true;
        
        autoTimer = setInterval(getDogImage, SLIDE_INTERVAL);
        getDogImage();
      } else {
        isAutoPlaying = false;
        autoBtn.textContent = "▶️ 자동 재생";
        autoBtn.classList.remove("playing");
        newDogBtn.disabled = false;
        
        clearInterval(autoTimer);
        loading.textContent = "슬라이드쇼 정지됨";
      }
    });

    // 웹 페이지 처음 열었을 때 실행
    getDogImage();
    newDogBtn.addEventListener("click", getDogImage);
  </script>

</body>
</html>
